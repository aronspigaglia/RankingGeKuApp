name: Release

# Baut die Electron-App für macOS (arm64, signiert + notarisiert) und Windows (x64)
# und hängt die Installer an ein GitHub-Release.
#
# Auslöser:
#   - Tag "vX.Y.Z" pushen  → Build + GitHub-Release
#   - manuell (workflow_dispatch) → nur Build, Installer als Workflow-Artifacts
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12        base64-kodiertes .p12 mit "Developer ID Application"-Zertifikat + Private Key
#   MACOS_CERTIFICATE_PASSWORD   Passwort, das beim Export des .p12 gesetzt wurde
#   APPLE_ID                     Apple-ID (E-Mail) des Developer-Accounts
#   APPLE_APP_SPECIFIC_PASSWORD  App-spezifisches Passwort (appleid.apple.com → Anmeldung und Sicherheit)
#   APPLE_TEAM_ID                Team-ID (10 Zeichen, z. B. aus dem Zertifikatsnamen)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DOTNET_VERSION: 8.0.x

jobs:
  check-version:
    name: Tag passt zu package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versionen vergleichen
        run: |
          PKG_VERSION="v$(node -p "require('./rankingGeKuAppElectron/package.json').version")"
          echo "package.json: $PKG_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag:          $GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version in rankingGeKuAppElectron/package.json ($PKG_VERSION)."
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64)
            make_script: make:mac
            artifact_glob: rankingGeKuAppElectron/out/make/**/*.zip
          - os: windows-latest
            label: Windows (x64)
            make_script: make:win
            artifact_glob: rankingGeKuAppElectron/out/make/**/*.exe
    steps:
      - name: Lange Pfade erlauben (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Frontend_RankingGeKu/package-lock.json
            rankingGeKuAppElectron/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: npm ci (Frontend)
        working-directory: Frontend_RankingGeKu
        run: npm ci

      - name: npm ci (Electron)
        working-directory: rankingGeKuAppElectron
        run: npm ci

      # --- macOS: Signatur-Zertifikat in eine temporäre Keychain importieren ---
      - name: Signatur-Zertifikat importieren (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Secrets MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD fehlen."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          CA_PATH="$RUNNER_TEMP/DeveloperIDCA.cer"

          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          # Apple-Zwischenzertifikat, damit codesign die Zertifikatskette aufbauen kann
          curl -fsSL -o "$CA_PATH" https://www.apple.com/certificateauthority/DeveloperIDCA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CA_PATH" -k "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          echo "Verfügbare Signatur-Identitäten:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Notarisierungs-Secrets prüfen (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::Secrets APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID fehlen."
            exit 1
          fi

      # --- Build: Frontend (ng build) + Backend (dotnet publish) + electron-forge make ---
      - name: Build (${{ matrix.label }})
        working-directory: rankingGeKuAppElectron
        env:
          # macOS-Signierung/Notarisierung (auf Windows ohne Wirkung)
          APPLE_IDENTITY: Developer ID Application
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.make_script }}

      - name: Build-Ergebnis anzeigen
        shell: bash
        run: find rankingGeKuAppElectron/out/make -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub-Release erstellen
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Dateien anzeigen
        run: ls -lhR dist

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.zip
            dist/**/*.exe
