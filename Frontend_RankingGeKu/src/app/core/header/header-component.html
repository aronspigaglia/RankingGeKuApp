<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm navbar-color">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="#">
      <img src="assets/geku-logo.png" alt="Logo" width="72.5" height="50" class="brand-logo" />
      <span class="header-title">Ranking maker Kutu</span>
      <button
        class="btn btn-outline-secondary btn-sm ms-auto egg-trigger"
        aria-label="Easter Egg"
        (click)="easterEgg()"
      >
        easterEgg
      </button>
    </a>
  </div>
</nav>
@if (showEasterEgg) {
  <div
    class="egg-backdrop"
    role="button"
    tabindex="0"
    (click)="closeEasterEgg()"
    (keydown.enter)="closeEasterEgg()"
    (keydown.space)="closeEasterEgg()"
  >
    <div
      class="egg-modal"
      role="dialog"
      aria-modal="true"
      tabindex="0"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="closeEasterEgg()"
      ></button>
      <img src="assets/made-you-look.jpg" alt="Easter egg" class="egg-image" />
      <h5 class="mt-3 mb-2">Easter Egg gefunden!</h5>
    </div>
  </div>
}
